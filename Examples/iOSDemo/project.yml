# iOS demo project, generated with XcodeGen:
#     cd Examples/iOSDemo && xcodegen generate
# The generated project (iOSDemo.xcodeproj) is committed, so xcodegen is
# only needed when this file changes.
name: iOSDemo
options:
  bundleIdPrefix: com.voltasdk.demo
  deploymentTarget:
    iOS: "26.0"
packages:
  VoltaSDK:
    path: ../..
targets:
  iOSDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: VoltaSDK
        product: VoltaSDKDemoUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.voltasdk.demo.ios
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J6HPZ958W6
        # ── Private Cloud Compute: OPT-IN ─────────────────────────────────
        # Left unwired so this demo builds for everyone (on iOS 27, PCC shows
        # "unavailable" and the chain falls back to on-device). To exercise
        # LIVE PCC: request the entitlement from Apple (see ../../README.md),
        # set your own DEVELOPMENT_TEAM above, then either add the "Private
        # Cloud Compute" capability in Xcode (Signing & Capabilities) or
        # uncomment the next line and re-run `xcodegen generate`:
        # CODE_SIGN_ENTITLEMENTS: iOSDemo.entitlements
  # ── Hosted evaluation bundle (D20) ─────────────────────────────────────
  # The package's `VoltaSDKEvals` engine, run inside the demo app ON A
  # DEVICE: the Mac's Apple Intelligence only stands in for an iPhone's; the
  # real on-device row of the capability map comes from this bundle on the
  # real phone (and the PCC row, when the app carries the entitlement).
  # Task files: add your own directory as a folder reference named EvalTasks
  # (a client app keeps its tasks in its own repo). Run with:
  #   xcodebuild test -scheme iOSDemoEvals -destination 'id=<device udid>' \
  #     TEST_RUNNER_VOLTA_EVAL_LIVE=1 TEST_RUNNER_VOLTA_EVAL_TIERS=on-device \
  #     -only-testing:iOSDemoEvals/LiveEvaluations 2>&1 | tee run.log
  #   python3 ../../scripts/evals-merge.py run.log   # fold [evals-entry] lines into the map
  iOSDemoEvals:
    type: bundle.unit-test
    platform: iOS
    sources:
      # The engine itself comes from the package product VoltaSDKEvals; only
      # the SDK's own eval tests (the live sweep + the engine tests) are
      # compiled here by path.
      - path: ../../Tests/VoltaSDKEvalsTests
        name: VoltaSDKEvalsTests
    dependencies:
      - target: iOSDemo
      - package: VoltaSDK
        product: VoltaSDK
      - package: VoltaSDK
        product: VoltaSDKEvals
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.voltasdk.demo.ios.evals
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J6HPZ958W6
schemes:
  iOSDemo:
    build:
      targets:
        iOSDemo: all
    run:
      config: Debug
  iOSDemoEvals:
    build:
      targets:
        iOSDemoEvals: all
        iOSDemo: all
    test:
      config: Debug
      targets:
        - iOSDemoEvals
